site:
  name: 'MS I.A & No-Code'
  site: 'https://www.mariamsanoko.fr'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: ''

metadata:
  title:
    default: 'MS I.A & No-Code'
    template: '%s — MS I.A & No-Code'
  description: 'Formations en ligne sur l’IA, le no-code, l’automatisation, Power Platform, Airtable, Make et les outils Microsoft.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 'MS I.A & No-Code'
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: fr
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true
        follow: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true
        follow: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true
        follow: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false
        follow: true

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system'
